 ''' To give spark level configs like executor cores,executor memory,application name etc..
of the enviornment(env)like Local- for developement,Test for testing and Prod for production.'''

[LOCAL]
spark.app.name = retail-local

[TEST]
spark.app.name = retail-test
spark.executor.instances = 3
spark.executor.cores = 5
spark.executor.memory = 15GB

[PROD]
spark.app.name = retail-prod
spark.executor.instances = 3
spark.executor.cores = 5
spark.executor.memory = 15GB